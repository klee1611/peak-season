id: sakura
display_name: Cherry blossoms (sakura)
local_names: { ja: 桜, ko: 벚꽃, zh-TW: 櫻花 }
# Ornamental flowering cherries only; genus Prunus would include plums and wild cherries.
# All names confirmed to resolve in /v1/taxa on 2026-10-09.
inat_taxa:
  - { name: Prunus serrulata, rank: species }
  - { name: Prunus × yedoensis, rank: hybrid }
  - { name: Prunus × subhirtella, rank: hybrid }
  - { name: Prunus campanulata, rank: species }
  - { name: Prunus sargentii, rank: species }
stages:                         # ordered; index = progress score; local_labels are for the UI
  - id: buds
    label: Buds
    local_labels: { ja: つぼみ, ko: 꽃봉오리, zh-TW: 含苞 }
  - id: first_bloom
    label: First bloom
    local_labels: { ja: 咲き始め, ko: 개화 시작, zh-TW: 初開 }
    go_now: true
  - id: full_bloom
    label: Full bloom
    local_labels: { ja: 満開, ko: 만개, zh-TW: 滿開 }
    go_now: true
  - id: falling_petals
    label: Falling petals
    local_labels: { ja: 散り始め, ko: 꽃잎 지는 중, zh-TW: 落櫻 }
photo_prompt: prompts/sakura_photo.txt
text_prompt: prompts/generic_text.txt
search_queries:
  en: '"cherry blossoms" "{place}"'
  ja: '"{place}" 桜 開花'
  ko: '"{place}" 벚꽃 개화'
  zh-TW: '"{place}" 櫻花 花況'
  fr: '"{place}" cerisiers en fleurs'
  de: '"{place}" Kirschblüte'
inat_annotation:
  term: Flowers and Fruits
  in_season: [Flowers]
  validation_groups:
    Flower Buds: [buds]
    Flowers: [first_bloom, full_bloom, falling_petals]
validated: true  # 2026-10-10: passed peakseason.validate, see NOTES.md
