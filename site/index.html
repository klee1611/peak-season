<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak Season</title>
  <meta name="description" content="Where seasonal nature is at its peak near you right now: autumn leaves, cherry blossoms and more. Crowdsourced, checked by an open-source AI model.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Peak Season</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </header>

  <main>
    <section id="locate" class="panel" hidden>
      <p id="locate-msg"></p>
      <label for="city" data-i18n="pick_city"></label>
      <select id="city"></select>
      <button id="use-location" type="button" data-i18n="use_my_location"></button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="results" hidden>
      <p id="headline" class="headline"></p>
      <div id="chips" class="chips" role="tablist"></div>
      <div class="controls">
        <label><span data-i18n="within"></span>
          <select id="radius">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </label>
        <button id="units" type="button"></button>
        <button id="change-place" type="button" data-i18n="change_place"></button>
      </div>
      <ol id="cards" class="cards"></ol>
      <button id="more" class="more" type="button" hidden></button>
    </section>
  </main>

  <footer class="foot">
    <p id="updated"></p>
    <p id="about"></p>
  </footer>

  <template id="card-tpl">
    <li class="card">
      <div class="card-head">
        <h2 class="place"></h2>
        <span class="badge"></span>
      </div>
      <p class="meta"></p>
      <figure class="evidence" hidden>
        <a class="evidence-link" rel="noopener" target="_blank">
          <img alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
        </a>
        <figcaption></figcaption>
      </figure>
      <p class="sources"></p>
      <div class="directions">
        <a class="dir google" rel="noopener" target="_blank">Google Maps</a>
        <a class="dir apple" rel="noopener" target="_blank">Apple Maps</a>
        <a class="dir osm" rel="noopener" target="_blank">OpenStreetMap</a>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
